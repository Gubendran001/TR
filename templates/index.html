<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITutor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #203a73, #070b18 65%);
            color: #fff;
        }
        .app {
            width: min(920px, 94vw); height: min(760px, 92vh);
            display: flex; flex-direction: column; overflow: hidden;
            background: rgba(10, 16, 35, .88); border: 1px solid #3b82f6;
            border-radius: 24px; box-shadow: 0 20px 70px rgba(0,0,0,.45);
            backdrop-filter: blur(14px);
        }
        header { padding: 22px 24px; border-bottom: 1px solid #27385f; }
        header h1 { margin: 0; font-size: 22px; }
        header p { margin: 7px 0 0; color: #9fb4dc; font-size: 13px; }
        #chat {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .msg {
            max-width: 78%; padding: 13px 16px; border-radius: 17px;
            line-height: 1.5; white-space: pre-wrap;
        }
        .bot { align-self: flex-start; background: #162445; border-bottom-left-radius: 5px; }
        .user { align-self: flex-end; background: #2563eb; border-bottom-right-radius: 5px; }
        form { display: flex; gap: 10px; padding: 18px; border-top: 1px solid #27385f; }
        input {
            flex: 1; padding: 14px 16px; border-radius: 14px;
            border: 1px solid #38517f; outline: none; background: #0c1428;
            color: white; font-size: 15px;
        }
        button {
            border: 0; border-radius: 14px; padding: 0 22px; cursor: pointer;
            background: #38bdf8; color: #07111f; font-weight: bold;
        }
        button:disabled { opacity: .6; cursor: wait; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>AITutor</h1>
        <p>Study-focused Gemini assistant</p>
    </header>
    <main id="chat">
        <div class="msg bot">Hi! Ask me a question about my study topic.</div>
    </main>
    <form id="form">
        <input id="message" placeholder="Ask your study question..." autocomplete="off">
        <button id="send">Send</button>
    </form>
</div>
<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const send = document.getElementById("send");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    send.disabled = true;

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message})
        });
        const data = await res.json();
        addMessage(data.reply || "No response received.", "bot");
    } catch {
        addMessage("Unable to connect to the chatbot.", "bot");
    } finally {
        send.disabled = false;
        input.focus();
    }
});
</script>
</body>
</html>
